name: Build social assets
on:
  push:
    branches: [main]
    paths:
      - "scripts/social_assets.py"
      - ".github/workflows/social-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/social_assets.py
      - name: Commit generated assets
        run: |
          git config user.name "TripPick Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/social
          git diff --cached --quiet && exit 0
          git commit -m "Generate original Facebook media assets"
          git push
