name: Submit sitemap to IndexNow
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "pawwise/*.html"
      - "sitemap.xml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit URLs
        run: python .github/indexnow_submit.py
